name: Desktop

# Unit tests + unsigned package builds for the Electron desktop shell
# (web/electron). This is a NON-BLOCKING signal while desktop support
# stabilizes: it is not wired into merge-ready.yml. Every step still fails
# its job. No step may publish: every electron-builder invocation passes
# `--publish never`, and the job token is read-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &desktop_paths
      # Shell sources, tests, e2e lane, and electron-builder config.
      - 'web/electron/**'
      # The SPA the shell serves and the overlay/selector pages it bundles.
      - 'web/src/**'
      - 'web/package.json'
      - 'web/vite*.ts'
      - 'web/index.html'
      # Dependency-only changes (an electron / electron-builder bump, a
      # lockfile regen) change what gets packaged, so they must build too.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      # The workflow itself and the Node/pnpm setup it reuses.
      - '.github/workflows/desktop-build.yml'
      - '.github/actions/setup-pnpm/**'
      # The Linux e2e leg boots a real `omnigent server` from the Python env
      # (desktopHarness.js mirrors the e2e_ui conftest), so its inputs count.
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'tests/e2e_ui/conftest.py'
      - 'omnigent/server/**'
  push:
    branches:
      - main
    paths: *desktop_paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the npm registry to the npmjs default (the lockfile is normalized to it).
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux tests + packages
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install fish + bsdtar
        # fish: the login-shell PATH regression spawns a real fish; it must
        # run here, never skip for a missing binary.
        # libarchive-tools: bsdtar, which fpm needs for the pacman target.
        run: |
          sudo apt-get update
          sudo apt-get install -y fish libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter ./web/electron --filter web

      - name: Unit tests
        run: pnpm --filter ./web/electron test

      - name: Build Linux packages
        run: pnpm --filter ./web/electron run build:linux --publish never

      - name: Check Linux payloads
        working-directory: web/electron/dist
        run: |
          set -euo pipefail
          ls -la
          for pattern in '*.AppImage' '*.deb' '*.pacman' 'latest-linux.yml'; do
            n=$(find . -maxdepth 1 -name "$pattern" | wc -l)
            if [ "$n" -ne 1 ]; then
              echo "::error::expected exactly one $pattern in web/electron/dist, found $n"
              exit 1
            fi
          done
          # Every file the updater feed names must sit next to it.
          grep -E '^\s*(-\s+)?(path|url):' latest-linux.yml | sed -E 's/^[^:]*:\s*//' | while read -r f; do
            if [ ! -f "$f" ]; then
              echo "::error::latest-linux.yml references a missing file: $f"
              exit 1
            fi
          done

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-appimage
          path: web/electron/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Upload deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-deb
          path: web/electron/dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload pacman
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-pacman
          path: web/electron/dist/*.pacman
          if-no-files-found: error
          retention-days: 14

      - name: Upload update feed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-latest-yml
          path: web/electron/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 14
